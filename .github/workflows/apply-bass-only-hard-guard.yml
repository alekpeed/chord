name: Apply bass-only transition hard guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-bass-only-hard-guard
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/harmony-accuracy

      - name: Apply hard bass-only transition guard and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          recognizer = Path('core/audio/src/main/kotlin/com/alekpeed/hearsay/core/audio/harmony/ChordRecognizer.kt')
          text = recognizer.read_text()

          if 'private fun stabilizeBassOnlyTransitions(' not in text:
              text = text.replace(
                  'private const val BassMaskMaxSuppression = 0.65f\nprivate const val PersistentBassSuppression = 0.15f\nprivate const val BassMaskPresenceThreshold = 0.25f\n',
                  'private const val BassMaskMaxSuppression = 0.90f\nprivate const val PersistentBassSuppression = 0.15f\nprivate const val BassMaskPresenceThreshold = 0.25f\nprivate const val BassOnlyChangeDistance = 0.28f\n',
                  1,
              )

              old = '''        val path = viterbi(emissions, gateChangeLikelihood(changeLikelihood, changeObservations))
        alignDelayedTransitions(path, spans, changeLikelihood)
        val refined = refineSpans(spans, path, chroma, changeLikelihood)
'''
              new = '''        val path = viterbi(emissions, gateChangeLikelihood(changeLikelihood, changeObservations))
        alignDelayedTransitions(path, spans, changeLikelihood)
        stabilizeBassOnlyTransitions(path, changeObservations, bassObservations)
        val refined = refineSpans(spans, path, chroma, changeLikelihood)
'''
              if old not in text:
                  raise SystemExit('recognizer path insertion point not found')
              text = text.replace(old, new, 1)

              marker = '''    /** Bass is named only after harmonic identity is settled. */
'''
              addition = '''    /**
     * Hard guard against bass-line chord churn. If the detected low bass moves but the
     * bass-reduced upper harmony remains essentially the same, the harmonic state is not allowed
     * to change. This is deliberately applied after timing alignment so later processing cannot
     * reintroduce a bass-only transition.
     */
    private fun stabilizeBassOnlyTransitions(
        path: IntArray,
        bassReducedObservations: List<FloatArray>,
        bassObservations: List<FloatArray>?,
    ) {
        if (bassObservations == null || path.size < 2) return
        val limit = minOf(path.size, bassReducedObservations.size, bassObservations.size)
        for (index in 1 until limit) {
            if (path[index] == path[index - 1]) continue
            val previousBass = dominantPitchClass(bassObservations[index - 1])
            val currentBass = dominantPitchClass(bassObservations[index])
            if (previousBass == null || currentBass == null || previousBass == currentBass) continue

            var dot = 0f
            for (pc in 0 until 12) {
                dot += bassReducedObservations[index - 1][pc] * bassReducedObservations[index][pc]
            }
            val upperHarmonyDistance = (1f - dot).coerceIn(0f, 1f)
            if (upperHarmonyDistance <= BassOnlyChangeDistance) {
                path[index] = path[index - 1]
            }
        }
    }

'''
              if marker not in text:
                  raise SystemExit('recognizer function insertion point not found')
              text = text.replace(marker, addition + marker, 1)

              text = text.replace(
                  ' * Reduces low-band pitch influence for change evidence only.\n',
                  ' * Reduces low-band pitch influence for change evidence and bass-only transition checks.\n',
                  1,
              )
              text = text.replace(
                  ' * useful only for asking whether the non-bass harmony moved enough to relax temporal continuity.\n',
                  ' * useful only for asking whether the non-bass harmony actually moved.\n',
                  1,
              )
              recognizer.write_text(text)

          test = Path('core/audio/src/test/kotlin/com/alekpeed/hearsay/core/audio/harmony/BassAndColorStabilityTest.kt')
          tests = test.read_text()
          if 'rapid bass motion cannot create chord churn' not in tests:
              marker = '''    @Test
    fun `full detail keeps stable altered color without creating another root`() {
'''
              addition = '''    @Test
    fun `rapid bass motion cannot create chord churn`() {
        val bassLine = listOf(9, 8, 7, 5, 4, 2)
        val framesPerSpan = 5
        val harmonicFrames = Array(bassLine.size * framesPerSpan + 1) { frame ->
            val bass = bassLine[minOf(frame / framesPerSpan, bassLine.lastIndex)]
            val values = FloatArray(12)
            for (pc in listOf(0, 4, 7, 10)) values[pc] += 0.70f
            values[bass] += 1.60f
            Chromagram.normalize(values)
        }
        val bassFrames = Array(harmonicFrames.size) { frame ->
            val bass = bassLine[minOf(frame / framesPerSpan, bassLine.lastIndex)]
            FloatArray(12).also { it[bass] = 1f }
        }

        val recognized = ChordRecognizer(
            slashChords = true,
            extensionPenalty = 1f,
        ).recognize(
            chroma = Chromagram(harmonicFrames, hopSeconds = 0.1),
            beatTimesMs = (0..bassLine.size).map { it * 500L },
            bassChroma = Chromagram(bassFrames, hopSeconds = 0.1),
            key = KeyContext(tonicPitchClass = 0, isMinor = false, confidence = 1f),
            changeLikelihood = FloatArray(bassLine.size) { if (it == 0) 0f else 1f },
        )

        val roots = recognized.mapNotNull { it.chord?.root?.pitchClass }
        assertTrue("Expected recognized harmony", roots.isNotEmpty())
        assertTrue("Rapid moving bass created chord churn: $roots", roots.distinct().size == 1)
        assertEquals("Stable upper harmony should remain rooted on C", 0, roots.first())
    }

'''
              if marker not in tests:
                  raise SystemExit('test insertion point not found')
              test.write_text(tests.replace(marker, addition + marker, 1))
          PY

      - uses: gradle/actions/setup-gradle@v4

      - name: Run chord stability tests
        run: ./gradlew :core:audio:test --tests '*BassAndColorStabilityTest' --tests '*ChordRecognizerStabilityTest' --stacktrace

      - name: Commit fix
        if: success()
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/audio/src/main/kotlin/com/alekpeed/hearsay/core/audio/harmony/ChordRecognizer.kt core/audio/src/test/kotlin/com/alekpeed/hearsay/core/audio/harmony/BassAndColorStabilityTest.kt
          git commit -m 'Block bass-only chord transitions'
          git push origin HEAD:chatgpt/harmony-accuracy
