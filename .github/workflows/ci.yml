name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Static analysis
        run: ./gradlew detekt --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      # Instrumentation and Compose UI tests are not run here: they need a device, and this runner
      # has no KVM. Run them locally with ./gradlew connectedDebugAndroidTest.

      - name: Training-pipeline tests
        run: |
          python3 -m pip install --quiet numpy
          python3 -m unittest discover training/tests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
