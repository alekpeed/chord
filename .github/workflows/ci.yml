name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply persistent root support candidate
        run: python3 ci/apply_root_support_candidate.py

      - name: Static analysis
        run: ./gradlew detekt --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Training-pipeline tests
        run: |
          python3 -m pip install --quiet numpy
          python3 -m unittest discover training/tests

      - name: Build Linux desktop package
        run: |
          ./gradlew :tools:desktop:createDistributable --stacktrace
          mkdir -p dist
          out="$PWD/dist"
          ( cd tools/desktop/build/compose/binaries/main/app && zip -qry "$out/hearsay-desktop-linux.zip" hearsay )

      - name: Upload Linux desktop package
        uses: actions/upload-artifact@v4
        with:
          name: hearsay-desktop-linux
          path: dist/hearsay-desktop-linux.zip
          if-no-files-found: error

      - name: Commit validated root support
        if: success() && github.head_ref == 'chatgpt/harmony-accuracy'
        run: |
          if git diff --quiet -- core/audio/src/main/kotlin/com/alekpeed/hearsay/core/audio/harmony/ChordRecognizer.kt; then
            exit 0
          fi
          git diff -- core/audio/src/main/kotlin/com/alekpeed/hearsay/core/audio/harmony/ChordRecognizer.kt > /tmp/root-support.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin chatgpt/harmony-accuracy
          git checkout -B chatgpt/harmony-accuracy origin/chatgpt/harmony-accuracy
          git reset --hard origin/chatgpt/harmony-accuracy
          git apply /tmp/root-support.patch
          git add core/audio/src/main/kotlin/com/alekpeed/hearsay/core/audio/harmony/ChordRecognizer.kt
          git commit -m 'Use persistent bass support for close root ties'
          git push origin HEAD:chatgpt/harmony-accuracy

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
