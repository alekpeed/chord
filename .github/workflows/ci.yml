name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Validate the seventh-root correction in the runner before committing it to the feature branch.
      - name: Apply persistent root support candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/audio/src/main/kotlin/com/alekpeed/hearsay/core/audio/harmony/ChordRecognizer.kt')
          text = path.read_text()
          if 'private fun persistentBassSupport(' in text:
              raise SystemExit(0)

          old = '''        val persistentRoots = persistentBassRoots(bassObservations)

        // Bass masking is deliberately limited to change gating. The raw harmonic chroma remains
'''
          new = '''        val persistentRoots = persistentBassRoots(bassObservations)
        val persistentSupport = persistentBassSupport(bassObservations)

        // Bass masking is deliberately limited to change gating. The raw harmonic chroma remains
'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        val emissions = rawObservations.mapIndexed { index, observation ->
            emissionScores(observation, priors, persistentRoots.getOrNull(index))
        }
'''
          new = '''        val emissions = rawObservations.mapIndexed { index, observation ->
            emissionScores(observation, priors, persistentSupport.getOrNull(index))
        }
'''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '''    /**
     * Novelty can be excited by a bass note even when bass is not allowed to determine the label.
'''
          addition = '''    /**
     * Keeps low-band support only when the same pitch class remains present in a neighboring span.
     * A walking bass note that appears for one span therefore cannot steer harmonic identity, while
     * a real root may remain useful even when another chord tone briefly measures louder.
     */
    private fun persistentBassSupport(bass: List<FloatArray>?): List<FloatArray> {
        if (bass == null) return emptyList()
        val relative = bass.map { vector ->
            val peak = vector.maxOrNull() ?: 0f
            if (peak < BassPresenceThreshold) {
                FloatArray(12)
            } else {
                FloatArray(12) { pc -> (vector.getOrElse(pc) { 0f } / peak).coerceIn(0f, 1f) }
            }
        }
        return relative.indices.map { index ->
            FloatArray(12) { pc ->
                val current = relative[index][pc]
                val agreesBefore = index > 0 && relative[index - 1][pc] >= BassPersistenceFloor
                val agreesAfter = index + 1 < relative.size && relative[index + 1][pc] >= BassPersistenceFloor
                current.takeIf { it >= BassPersistenceFloor && (agreesBefore || agreesAfter) } ?: 0f
            }
        }
    }

'''
          assert marker in text
          text = text.replace(marker, addition + marker, 1)

          start = text.index('''    private fun emissionScores(\n''')
          end = text.index('''    private fun hasSeventhSupport''', start)
          replacement = '''    private fun emissionScores(
        observed: FloatArray,
        priors: FloatArray,
        persistentBassSupport: FloatArray?,
    ): FloatArray {
        val scores = FloatArray(ChordTemplates.StateCount)
        for ((index, candidate) in ChordTemplates.Candidates.withIndex()) {
            var dot = 0f
            for (pc in 0 until 12) {
                val weight = if (extensionPenalty != 1f && isColorTone(candidate, pc)) {
                    extensionPenalty
                } else {
                    1f
                }
                dot += observed[pc] * candidate.vector[pc] * weight
            }
            scores[index] = dot * priors[index]
        }
        applyPersistentBassRootTieBreak(scores, observed, persistentBassSupport)

        var energy = 0f
        for (value in observed) energy += value * value
        scores[ChordTemplates.NoChordIndex] = if (energy < 1e-4f) 1f else noChordThreshold
        return scores
    }

    private fun applyPersistentBassRootTieBreak(
        scores: FloatArray,
        observed: FloatArray,
        persistentBassSupport: FloatArray?,
    ) {
        if (persistentBassSupport == null || persistentBassSupport.isEmpty()) return
        val bestFullBand = ChordTemplates.Candidates.indices.maxOfOrNull { scores[it] } ?: return
        if (bestFullBand <= 0f) return

        var promotedIndex = -1
        var promotedEvidence = 0f
        for ((index, candidate) in ChordTemplates.Candidates.withIndex()) {
            if (scores[index] < bestFullBand * BassTieBreakFloor) continue
            val support = persistentBassSupport.getOrElse(candidate.root) { 0f }
            if (support < BassRootSupportFloor || !hasSeventhSupport(candidate, observed)) continue
            val evidence = support * scores[index]
            if (evidence > promotedEvidence) {
                promotedEvidence = evidence
                promotedIndex = index
            }
        }
        if (promotedIndex >= 0) {
            scores[promotedIndex] = maxOf(scores[promotedIndex], bestFullBand * BassRootPreference)
        }
    }

'''
          text = text[:start] + replacement + text[end:]

          old = '''        const val SustainedSeventhRootBoost = 1.32f
        const val SeventhSupportRatio = 0.35f
'''
          new = '''        const val BassTieBreakFloor = 0.86f
        const val BassRootSupportFloor = 0.35f
        const val BassRootPreference = 1.08f
        const val BassPersistenceFloor = 0.25f
        const val SeventhSupportRatio = 0.35f
'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Static analysis
        run: ./gradlew detekt --stacktrace

      - name: Build Linux desktop package
        run: |
          ./gradlew :tools:desktop:createDistributable --stacktrace
          mkdir -p dist
          out="$PWD/dist"
          ( cd tools/desktop/build/compose/binaries/main/app && zip -qry "$out/hearsay-desktop-linux.zip" hearsay )

      - name: Upload Linux desktop package
        uses: actions/upload-artifact@v4
        with:
          name: hearsay-desktop-linux
          path: dist/hearsay-desktop-linux.zip
          if-no-files-found: error

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Commit validated root support
        if: success() && github.head_ref == 'chatgpt/harmony-accuracy'
        run: |
          if git diff --quiet -- core/audio/src/main/kotlin/com/alekpeed/hearsay/core/audio/harmony/ChordRecognizer.kt; then
            exit 0
          fi
          git diff -- core/audio/src/main/kotlin/com/alekpeed/hearsay/core/audio/harmony/ChordRecognizer.kt > /tmp/root-support.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin chatgpt/harmony-accuracy
          git checkout -B chatgpt/harmony-accuracy origin/chatgpt/harmony-accuracy
          git apply /tmp/root-support.patch
          git add core/audio/src/main/kotlin/com/alekpeed/hearsay/core/audio/harmony/ChordRecognizer.kt
          git commit -m 'Use persistent bass support for close root ties'
          git push origin HEAD:chatgpt/harmony-accuracy

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Training-pipeline tests
        run: |
          python3 -m pip install --quiet numpy
          python3 -m unittest discover training/tests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
