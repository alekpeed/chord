build:
  maxIssues: 0

complexity:
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    # Composables take their state and callbacks as parameters by design; hoisting them into a
    # holder class to satisfy a count would hide the dependencies rather than reduce them.
    active: true
    functionThreshold: 12
    constructorThreshold: 12
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: true
    threshold: 20

style:
  MagicNumber:
    # Music code is full of intervals, semitones and beat counts. Naming every
    # one of them hurts readability more than it helps.
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140
  ReturnCount:
    active: true
    max: 6
  UnusedPrivateMember:
    active: true
  ForbiddenComment:
    active: false

formatting:
  MaximumLineLength:
    active: true
    maxLineLength: 140
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    active: false
  ArgumentListWrapping:
    active: false
  ParameterListWrapping:
    active: false
  Wrapping:
    active: false
  MultiLineIfElse:
    active: false
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][A-Za-z0-9]*'

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
